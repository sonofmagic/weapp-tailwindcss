[build]
publish = "website/build"
command = "pnpm run build:docs"

[build.environment]
NODE_VERSION = "22"

[[redirects]]
from = "/en/*"
to = "/:splat"
status = 301
force = true

[[redirects]]
from = "/zh-cn/*"
to = "/zh-cn/404.html"
status = 404

[[redirects]]
from = "/*"
to = "/404.html"
status = 404

[context.deploy-preview]
ignore = "exit 0"
