name: Build and Deploy Docs Worker

on:
  pull_request:
    paths:
      - .github/workflows/docs.yml
      - 'website/**'
      - 'packages/**'
      - 'packages-runtime/**'
      - pnpm-lock.yaml
  push:
    branches:
      - main
      - next
    paths:
      - .github/workflows/docs.yml
      - 'website/**'
      - 'packages/**'
      - 'packages-runtime/**'
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-worker-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build${{ github.event_name == 'pull_request' && ' and dry-run' || ' and deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ github.ref == 'refs/heads/next' && 'https://next.tw.icebreaker.top' || 'https://tw.icebreaker.top' }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run few_keywords gate
        run: pnpm --filter @weapp-tailwindcss/website seo:few-keywords

      - name: Build website
        run: pnpm --filter @weapp-tailwindcss/website build

      - name: Run SEO/GEO quality gate
        run: pnpm --filter @weapp-tailwindcss/website seo:quality:strict

      - name: Verify Worker routing locally
        run: pnpm --filter @weapp-tailwindcss/website test:worker

      - name: Validate Worker bundle
        run: pnpm --filter @weapp-tailwindcss/website deploy:worker:dry-run

      - name: Require Cloudflare credentials
        if: github.event_name != 'pull_request' && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '')
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required for Workers deployment."
          exit 1

      - name: Deploy production Worker
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: website
        run: pnpm run deploy:worker

      - name: Deploy next Worker
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/next'
        working-directory: website
        run: pnpm run deploy:worker:next

      - name: Verify production deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: website
        run: |
          pnpm run verify:deployment -- https://tw.icebreaker.top
          pnpm run verify:deployment -- https://weapp-tw.icebreaker.top --canonical-origin https://tw.icebreaker.top

      - name: Verify next deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/next'
        working-directory: website
        run: pnpm run verify:deployment -- https://next.tw.icebreaker.top
