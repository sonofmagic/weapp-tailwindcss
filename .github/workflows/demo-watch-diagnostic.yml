name: Windows Demo Watch Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/demo-watch-diagnostic.yml
      - packages/weapp-tailwindcss/src/bundlers/webpack/**
      - demo/subpackage-taro-webpack-react-tailwindcss-v4/**
  workflow_dispatch:

concurrency:
  group: windows-watch-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  watch:
    name: Windows subpackage H5 repeated watch
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: 24
      - run: pnpm build:ci
      - run: pnpm exec playwright install chromium
      - name: Repeat full production and live update acceptance
        shell: bash
        env:
          CI: '1'
          DEBUG: weapp-tw
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          for attempt in 1 2 3; do
            DEMO_MATRIX_ARTIFACT_DIR="e2e/.artifacts/watch-diagnostic/$attempt" pnpm e2e:demo:matrix subpackage-taro-webpack-react-tailwindcss-v4:h5 || exit 1
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-subpackage-watch-diagnostic
          path: e2e/.artifacts/watch-diagnostic/**
          if-no-files-found: error
          retention-days: 14
