name: Demo Watch Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/demo-watch-diagnostic.yml
      - packages/weapp-tailwindcss/src/bundlers/webpack/**
      - demo/subpackage-taro-webpack-react-tailwindcss-v4/**
      - scripts/ci/demo-matrix/**
  workflow_dispatch:
    inputs:
      scenario:
        description: 选择常规 watch 或 uni-app x Issue 的 Windows IDE 验证
        type: choice
        default: portable-watch
        options: [portable-watch, issues-1170-1144]

concurrency:
  group: windows-watch-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  watch:
    if: github.event_name != 'workflow_dispatch' || inputs.scenario != 'issues-1170-1144'
    name: Repeated watch (${{ matrix.os || 'windows-latest' }}, Node ${{ matrix.node || 24 }}, ${{ matrix.case }})
    runs-on: ${{ matrix.os || 'windows-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case:
          - subpackage-taro-webpack-react-tailwindcss-v4:h5
          - taro-webpack-vue3-tailwindcss-v4:weapp
          - taro-vite-vue3-tailwindcss-v4:jd
          - taro-vite-vue3-tailwindcss-v4:h5
          - subpackage-taro-webpack-react-tailwindcss-v4:tt
          - gulp-tailwindcss-v4:tt
        include:
          - case: mpx-tailwindcss-v4:wx
            os: windows-latest
            node: 22
          - case: mpx-tailwindcss-v4:wx
            os: windows-latest
            node: 24
          - case: uni-app-vite-tailwindcss-v4:mp-weixin
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ matrix.node || 24 }}
      - run: pnpm build:ci
      - run: pnpm exec playwright install chromium
      - run: pnpm test:demo:matrix
        env:
          CI: '1'
      - name: Repeat full production and live update acceptance
        shell: bash
        env:
          CI: '1'
          DEBUG: weapp-tw
          NODE_OPTIONS: --max-old-space-size=6144
          DEMO_CASE: ${{ matrix.case }}
        run: |
          export NODE_OPTIONS="$NODE_OPTIONS --trace-exit --trace-uncaught --require=$GITHUB_WORKSPACE/scripts/ci/demo-matrix/process-diagnostic.cjs"
          if [[ "$DEMO_CASE" == *webpack* ]]; then
            export NODE_OPTIONS="$NODE_OPTIONS --require=$GITHUB_WORKSPACE/scripts/ci/demo-matrix/watch-diagnostic.cjs"
          fi
          for attempt in 1 2 3; do
            DEMO_MATRIX_ARTIFACT_DIR="e2e/.artifacts/watch-diagnostic/$attempt" pnpm e2e:demo:matrix "$DEMO_CASE" || exit 1
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-watch-diagnostic-${{ strategy.job-index }}
          path: e2e/.artifacts/watch-diagnostic/**
          if-no-files-found: error
          retention-days: 14

  windows-uni-app-x:
    if: github.event_name == 'workflow_dispatch' && inputs.scenario == 'issues-1170-1144'
    name: Windows HBuilderX ${{ matrix.channel }} issues 1170 and 1144
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            version: 5.24.2026081301
          - channel: alpha
            version: 5.25.2026082902-alpha
    env:
      CI: '1'
      HBUILDERX_CHANNEL: ${{ matrix.channel }}
      HBUILDERX_VERSION: ${{ matrix.version }}
      E2E_ISSUE_1170_WEB: '1'
      E2E_ISSUE_1144_STABLE: ${{ matrix.channel == 'stable' && '1' || '0' }}
      E2E_ISSUE_1144_ALPHA: ${{ matrix.channel == 'alpha' && '1' || '0' }}
      E2E_HBUILDERX_WEB_TIMEOUT_MS: '120000'
    steps:
      - uses: actions/checkout@v6
      - run: git config core.longpaths true
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: '24'
      - name: Build current source and dependencies
        run: pnpm --filter weapp-tailwindcss... run build
      - name: Install browser
        run: pnpm exec playwright install chromium
      - name: Cache official HBuilderX toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/issue-hbuilderx-${{ matrix.version }}
          key: issue-hbuilderx-win-${{ matrix.version }}-v1
      - name: Prepare official Windows IDE
        run: node scripts/ci/issue-hbuilderx-windows.mjs
      - name: Verify path ownership and real Web HMR
        shell: pwsh
        run: |
          pnpm --filter weapp-tailwindcss exec vitest run test/uni-app-x/vite-style-requests.test.ts --update=none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec vitest run -c e2e/vitest.e2e.config.ts e2e/issue-1170-web.test.ts e2e/issue-1144-stable.test.ts e2e/issue-1144-alpha.test.ts --update=none
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-issues-1170-1144-${{ matrix.channel }}
          path: |
            e2e/.artifacts/issue-hbuilderx-windows/**
            e2e/.artifacts/web-hmr/**
          if-no-files-found: error
          retention-days: 14
