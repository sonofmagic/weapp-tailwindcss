# repoctl-managed: release/v2
name: Release

on:
  push:
    branches:
      - main
      - alpha
      - beta
      - rc
      - next
  workflow_dispatch:
    inputs:
      mode:
        description: Release operation
        required: true
        default: auto
        type: choice
        options:
          - auto
          - prepare
          - publish
          - publish-unpublished
      package:
        description: Package used for unpublished-version recovery
        required: false
        type: string
      version:
        description: Version used for unpublished-version recovery
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  HUSKY: 0
  NPM_CONFIG_PROVENANCE: true
  npm_config_registry: https://registry.npmjs.org

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repo release CI
        env:
          GITHUB_TOKEN: ${{ secrets.REPOCTL_RELEASE_TOKEN || secrets.CHANGESETS_RELEASE_TOKEN || github.token }}
          REPO_RELEASE_MODE: ${{ inputs.mode || 'auto' }}
          REPO_RELEASE_PACKAGE: ${{ inputs.package }}
          REPO_RELEASE_VERSION: ${{ inputs.version }}
        run: pnpm exec repo release ci

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
