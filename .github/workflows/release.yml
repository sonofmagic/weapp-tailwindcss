# repoctl-managed: release/v2
name: Release

on:
  push:
    branches:
      - main
      - alpha
      - beta
      - rc
      - next
  workflow_dispatch:
    inputs:
      mode:
        description: Release operation
        required: true
        default: auto
        type: choice
        options:
          - auto
          - prepare
          - publish
          - publish-unpublished
      package:
        description: Package used for unpublished-version recovery
        required: false
        type: string
      version:
        description: Version used for unpublished-version recovery
        required: false
        type: string

env:
  HUSKY: 0
  NPM_CONFIG_PROVENANCE: true
  npm_config_registry: https://registry.npmjs.org

permissions:
  actions: read
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: |
          for attempt in 1 2 3 4; do
            if pnpm exec playwright install chromium; then
              exit 0
            fi
            echo "Playwright Chromium install failed, retrying (${attempt}/4)"
            sleep $((attempt * 10))
          done
          pnpm exec playwright install chromium

      - name: Download same-commit coverage certificate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CERTIFICATE_RUN_ID: ${{ vars.RELEASE_CERTIFICATE_RUN_ID }}
        run: |
          run_id="$RELEASE_CERTIFICATE_RUN_ID"
          if [ -z "$run_id" ]; then
            run_id="$(gh run list --workflow e2e-coverage-nightly.yml --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$run_id" || { echo "No successful same-commit coverage workflow run" >&2; exit 1; }
          rm -rf e2e/.artifacts/release-certificate
          mkdir -p e2e/.artifacts/release-certificate
          gh run download "$run_id" --name "coverage-certificate-$GITHUB_SHA" --dir e2e/.artifacts/release-certificate

      - name: Validate release certificate
        shell: bash
        run: |
          report="$(find e2e/.artifacts/release-certificate -type f \( -name 'nightly-report.json' -o -name 'pr-report.json' -o -name 'coverage-report.json' \) -print -quit)"
          test -n "$report" || { echo "Coverage report is missing from certificate artifact" >&2; exit 1; }
          pnpm e2e:coverage:release-gate --report "$report"

      - name: Run repo release CI
        env:
          GITHUB_TOKEN: ${{ secrets.REPOCTL_RELEASE_TOKEN || secrets.CHANGESETS_RELEASE_TOKEN || github.token }}
          REPO_RELEASE_MODE: ${{ inputs.mode || 'auto' }}
          REPO_RELEASE_PACKAGE: ${{ inputs.package }}
          REPO_RELEASE_VERSION: ${{ inputs.version }}
        run: pnpm exec repo release ci

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
