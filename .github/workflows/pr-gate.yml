name: Published package verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-utilities:
    name: npm 5.5.2 (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node: 22
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ matrix.node }}
      - name: Verify registry package without local package build
        env:
          WEAPP_TW_VERIFY_PUBLISHED_VERSION: 5.5.2
        run: pnpm e2e:windows-utilities
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-5.5.2-${{ matrix.os }}-node${{ matrix.node }}
          path: e2e/.artifacts/windows-utilities/**
          if-no-files-found: error
